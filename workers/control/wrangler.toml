# Local development and workerd tests only. Production deployment configuration
# will be introduced separately with explicit account resources and routes.
name = "zudo-ez-host-control-local"
main = "src/index.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "zudo-ez-host-control-local"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zudo-ez-host-artifacts-local"
