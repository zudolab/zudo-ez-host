# Local development and workerd tests only. Production deployment configuration
# will be introduced separately with explicit account resources and routes.
name = "zudo-ez-host-control-local"
main = "src/index.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]

# Non-secret local/test defaults. Production auth secrets, the signup allowlist,
# and Google credentials are set with `wrangler secret put`.
[vars]
BETTER_AUTH_BASE_URL = "https://control.test"
BETTER_AUTH_TRUSTED_ORIGINS = "https://control.test"

[[d1_databases]]
binding = "DB"
database_name = "zudo-ez-host-control-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zudo-ez-host-artifacts-local"

[[services]]
binding = "PUBLICATION_RESOLVER"
service = "zudo-ez-host-control-local"
entrypoint = "PublicationResolver"
