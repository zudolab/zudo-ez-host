# Local development and workerd tests only. Named environments below are the
# deploy descriptors; keep this top-level fixture stable for the workerd lanes.
name = "zudo-ez-host-control-local"
main = "src/index.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]

# Non-secret local/test defaults. Production auth secrets, the signup allowlist,
# and Google credentials are set with `wrangler secret put`.
[vars]
BETTER_AUTH_BASE_URL = "https://control.test"
BETTER_AUTH_TRUSTED_ORIGINS = "https://control.test"

[[d1_databases]]
binding = "DB"
database_name = "zudo-ez-host-control-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zudo-ez-host-artifacts-local"

[[services]]
binding = "PUBLICATION_RESOLVER"
service = "zudo-ez-host-control-local"
entrypoint = "PublicationResolver"
# Test-only self-binding. Never copy this into a deploy environment: the target
# would not exist during the first control Worker deployment.

[env.staging]
name = "zudo-ez-host-control-staging"
services = [] # Explicitly empty: the top-level self-binding is test-only.

[env.staging.vars]
BETTER_AUTH_BASE_URL = "https://zudo-ez-host-control-staging.YOUR_WORKERS_SUBDOMAIN.workers.dev"
BETTER_AUTH_TRUSTED_ORIGINS = "https://zudo-ez-host-control-staging.YOUR_WORKERS_SUBDOMAIN.workers.dev"
CONTROL_BASE_DOMAIN = "zudo-ez-host-control-staging.YOUR_WORKERS_SUBDOMAIN.workers.dev"
PUBLIC_BASE_DOMAIN = "YOUR_WORKERS_SUBDOMAIN.workers.dev"
R2_ACCOUNT_ID = "YOUR_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET_NAME = "zudo-ez-host-artifacts-staging"

[env.staging.secrets]
required = ["BETTER_AUTH_SECRET", "SIGNUP_ALLOWED_EMAILS", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "zudo-ez-host-control-staging"
database_id = "00000000-0000-0000-0000-000000000000" # Filled during provisioning; see docs/ops/environments.md.
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zudo-ez-host-artifacts-staging"

[env.staging.observability]
enabled = true

[env.production]
name = "zudo-ez-host-control"
services = [] # Explicitly empty: the top-level self-binding is test-only.

[env.production.vars]
BETTER_AUTH_BASE_URL = "https://control.YOUR_CONTROL_DOMAIN"
BETTER_AUTH_TRUSTED_ORIGINS = "https://control.YOUR_CONTROL_DOMAIN"
CONTROL_BASE_DOMAIN = "control.YOUR_CONTROL_DOMAIN"
PUBLIC_BASE_DOMAIN = "YOUR_PUBLIC_DOMAIN"
R2_ACCOUNT_ID = "YOUR_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET_NAME = "zudo-ez-host-artifacts-production"

[env.production.secrets]
required = ["BETTER_AUTH_SECRET", "SIGNUP_ALLOWED_EMAILS", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY"]

[[env.production.routes]]
pattern = "control.YOUR_CONTROL_DOMAIN"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "zudo-ez-host-control-production"
database_id = "00000000-0000-0000-0000-000000000000" # Filled during provisioning; see docs/ops/environments.md.
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zudo-ez-host-artifacts-production"

[env.production.observability]
enabled = true
